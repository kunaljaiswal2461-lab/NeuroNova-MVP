    - question: "How many customers signed up in 2025?"
      reference_sql: |
        SELECT count(*) FROM shop.customers
        WHERE signup_at >= TIMESTAMPTZ '2025-01-01 00:00:00+05:30' AND signup_at < TIMESTAMPTZ '2026-01-01 00:00:00+05:30'
