    reference_sql: |
      SELECT count(*) FROM shop.customers
      WHERE signup_at >= TIMESTAMPTZ '2024-01-01 00:00:00+05:30' AND signup_at < TIMESTAMPTZ '2025-01-01 00:00:00+05:30'
    output_type: kpi
  reviewed_by: null

# ── topic switches: the old filter must NOT carry over (3) ───────────────────
- id: chain-014
  question: "How many customers do we have in total?"
  tags: [chain, topic_switch, aggregate]
  turns:
    - question: "How many orders did customers place through the web channel?"
      reference_sql: "SELECT count(*) FROM shop.orders WHERE channel = 'web'"
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FROM shop.customers
    output_type: kpi
  reviewed_by: null

- id: chain-015
  question: "How many products are active?"
  tags: [chain, topic_switch, aggregate]
  turns:
    - question: "What is the total value of paid orders?"
      reference_sql: "SELECT sum(total_amount) FROM shop.orders WHERE status = 'PAID'"
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FROM shop.products WHERE is_active
    output_type: kpi
  reviewed_by: null

- id: chain-016
  question: "Now, how many refunds have been issued in total?"
  tags: [chain, topic_switch, aggregate]
  turns:
    - question: "How many orders do we have in each status?"
      reference_sql: "SELECT status, count(*) FROM shop.orders GROUP BY status"
    - question: "Only for the phone channel."
      reference_sql: "SELECT status, count(*) FROM shop.orders WHERE channel = 'phone' GROUP BY status"
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FROM shop.refunds
    output_type: kpi
  reviewed_by: null

# ── follow-ups to a clarification (2) ────────────────────────────────────────
- id: chain-017
  question: "Gross order value, please. Paid orders only."
  tags: [chain, clarification_followup, join_3plus]
  turns:
    - question: "Show me revenue by region."
      clarification: "Do you mean gross order value, or order value after refunds?"
  expect:
    kind: answer
    reference_sql: |
      SELECT r.name, sum(o.total_amount)
      FROM shop.orders o
      JOIN shop.customers c ON c.id = o.customer_id
      JOIN shop.regions r ON r.id = c.region_id
      WHERE o.status = 'PAID'
      GROUP BY r.name
    output_type: bar
  reviewed_by: null

- id: chain-018
  question: "The calendar month."
  tags: [chain, clarification_followup, time_bucket]
  turns:
    - question: "How many orders did we get last month?"
      clarification: "Do you mean the previous calendar month, or the last 30 days?"
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FROM shop.orders
      WHERE ordered_at >= TIMESTAMPTZ '2026-05-01 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-06-01 00:00:00+05:30'
    output_type: kpi
  reviewed_by: null

