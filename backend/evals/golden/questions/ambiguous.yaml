- id: amb-001
  question: "Who are our best customers?"
  tags: [ambiguous]
  expect:
    kind: clarification
    acceptable_answers:
      - reference_sql: |
          SELECT c.full_name, sum(o.total_amount) AS spend
          FROM shop.orders o JOIN shop.customers c ON c.id = o.customer_id
          WHERE o.status = 'PAID' GROUP BY c.id, c.full_name ORDER BY spend DESC LIMIT 10
        order_matters: true
      - reference_sql: |
          SELECT c.full_name, count(*) AS orders
          FROM shop.orders o JOIN shop.customers c ON c.id = o.customer_id
          GROUP BY c.id, c.full_name ORDER BY orders DESC, c.id LIMIT 10
        order_matters: true
  notes: "Best by spend, by order count, or by recency? A reasonable system asks."
  reviewed_by: null

- id: amb-002
  question: "What's our revenue?"
  tags: [ambiguous]
  expect:
    kind: clarification
    acceptable_answers:
      - reference_sql: "SELECT sum(total_amount) FROM shop.orders WHERE status = 'PAID'"
      - reference_sql: |
          SELECT (SELECT sum(total_amount) FROM shop.orders WHERE status = 'PAID') - (SELECT sum(amount) FROM shop.refunds)
  notes: "Gross or net of refunds? Paid orders only? Including GST? No metric is confirmed."
  reviewed_by: null

- id: amb-003
  question: "Which products are performing best?"
  tags: [ambiguous]
  expect:
    kind: clarification
    acceptable_answers:
      - reference_sql: |
          SELECT p.sku, sum(i.quantity) AS units FROM shop.order_items i JOIN shop.products p ON p.id = i.product_id
          GROUP BY p.id, p.sku ORDER BY units DESC LIMIT 10
        order_matters: true
  notes: "By units, by value, by margin? Over what period?"
  reviewed_by: null

