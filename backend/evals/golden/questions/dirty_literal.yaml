- id: dirty-001
  question: "How many pending orders are there?"
  tags: [dirty_literal]
  difficulty: easy
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FROM shop.orders WHERE status = 'pending'
    output_type: kpi
  notes: "Stored value is lowercase 'pending'; WHERE status = 'PENDING' silently returns 0."
  reviewed_by: null

