- id: dirty-004
  question: "How many Enterprise customers do we have?"
  tags: [dirty_literal]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FROM shop.customers WHERE lower(trim(segment)) = 'enterprise'
    output_type: kpi
  notes: "Includes the 12 padded lowercase 'enterprise ' rows: 436, not 424."
  reviewed_by: null

- id: dirty-005
  question: "What is the total value of paid orders from Enterprise customers?"
  tags: [dirty_literal]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT sum(o.total_amount) FROM shop.orders o JOIN shop.customers c ON c.id = o.customer_id WHERE o.status = 'PAID' AND lower(trim(c.segment)) = 'enterprise'
    output_type: kpi
  notes: "Enterprise includes padded variants. accept-survivor:join_flip (a later INNER JOIN or a WHERE on the joined table removes the rows a LEFT JOIN would add)"
  reviewed_by: null

