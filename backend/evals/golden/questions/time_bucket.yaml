- id: time-010
  question: "Which two hours of the day are busiest for orders?"
  tags: [time_bucket]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT extract(hour FROM ordered_at AT TIME ZONE 'Asia/Kolkata')::int AS hour, count(*) FROM shop.orders GROUP BY 1 ORDER BY 2 DESC LIMIT 2
    output_type: ranked_list
    order_matters: true
  notes: "IST hour of day, 0-23."
