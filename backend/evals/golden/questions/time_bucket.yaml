- id: time-005
  question: "How does this month's order count compare with last month's?"
  tags: [time_bucket, tz_boundary]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FILTER (WHERE ordered_at >= TIMESTAMPTZ '2026-06-01 00:00:00+05:30') AS this_month,
             count(*) FILTER (WHERE ordered_at <  TIMESTAMPTZ '2026-06-01 00:00:00+05:30') AS last_month
      FROM shop.orders
      WHERE ordered_at >= TIMESTAMPTZ '2026-05-01 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-07-01 00:00:00+05:30'
    output_type: kpi_comparison
  notes: "This month = June 2026 to date (the data ends on 14 June), last month = May 2026. Both IST. Two numbers: this month and last month. accept-survivor:drop_predicate (dropping this predicate cannot change the answer on this data (the bound lies beyond the data, which ends on 14 June 2026, or the predicate is redundant)); accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

- id: time-006
  question: "What was the total value of paid orders in each quarter of 2025?"
  tags: [time_bucket]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT date_trunc('quarter', ordered_at AT TIME ZONE 'Asia/Kolkata')::date AS quarter, sum(total_amount) FROM shop.orders WHERE status = 'PAID' AND ordered_at >= TIMESTAMPTZ '2025-01-01 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-01-01 00:00:00+05:30' GROUP BY 1
    output_type: bar
  notes: "Quarter labels are the first day of the quarter (a date). IST."
  reviewed_by: null

- id: time-007
  question: "Show the number of paid orders for each week of May 2026."
  tags: [time_bucket]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT date_trunc('week', ordered_at AT TIME ZONE 'Asia/Kolkata')::date AS week, count(*)
      FROM shop.orders
      WHERE status = 'PAID' AND ordered_at >= TIMESTAMPTZ '2026-05-01 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-06-01 00:00:00+05:30'
      GROUP BY 1 ORDER BY 1
    output_type: line
    order_matters: true
  notes: "Weeks start on Monday and are labelled by their Monday (a date). Only orders inside May are counted, so the first and last weeks are partial."
  reviewed_by: null

