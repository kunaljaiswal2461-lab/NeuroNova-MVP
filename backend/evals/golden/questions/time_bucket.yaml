- id: time-009
  question: "How many orders were placed between midnight and 6 am?"
  tags: [time_bucket]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FROM shop.orders WHERE extract(hour FROM ordered_at AT TIME ZONE 'Asia/Kolkata') < 6
