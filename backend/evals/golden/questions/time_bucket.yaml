- id: time-001
  question: "How many orders did we get in March 2026?"
  tags: [time_bucket, tz_boundary, aggregate]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT count(*) FROM shop.orders
      WHERE ordered_at >= TIMESTAMPTZ '2026-03-01 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-04-01 00:00:00+05:30'
    output_type: kpi
  notes: "Month boundaries are IST. UTC bucketing gives a different count (planted boundary orders)."
  reviewed_by: null

- id: time-002
  question: "Show the number of orders in each month of 2025."
  tags: [time_bucket]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT date_trunc('month', ordered_at AT TIME ZONE 'Asia/Kolkata')::date AS month, count(*) FROM shop.orders WHERE ordered_at >= TIMESTAMPTZ '2025-01-01 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-01-01 00:00:00+05:30' GROUP BY 1 ORDER BY 1
    output_type: line
    order_matters: true
  notes: "Month labels are the first day of the month (a date). IST buckets."
  reviewed_by: null

- id: time-003
  question: "How many orders did we get in each month of 2026 so far?"
  tags: [time_bucket, tz_boundary]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT date_trunc('month', ordered_at AT TIME ZONE 'Asia/Kolkata')::date AS month, count(*) FROM shop.orders WHERE ordered_at >= TIMESTAMPTZ '2026-01-01 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-07-01 00:00:00+05:30' GROUP BY 1 ORDER BY 1
    output_type: line
    order_matters: true
  notes: "Month labels are the first day of the month (a date). June is month-to-date. IST buckets; 2026 has planted boundary orders. accept-survivor:drop_predicate (dropping this predicate cannot change the answer on this data (the bound lies beyond the data, which ends on 14 June 2026, or the predicate is redundant)); accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

- id: time-004
