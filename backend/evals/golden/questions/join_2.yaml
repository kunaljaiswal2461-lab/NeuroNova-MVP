- id: join2-015
  question: "Which customers placed an order on 14 June 2026?"
  tags: [join_2, tz_boundary]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT DISTINCT c.id, c.full_name FROM shop.orders o JOIN shop.customers c ON c.id = o.customer_id
      WHERE o.ordered_at >= TIMESTAMPTZ '2026-06-14 00:00:00+05:30' AND o.ordered_at < TIMESTAMPTZ '2026-06-15 00:00:00+05:30'
    output_type: table
  notes: "IST day; each customer once. accept-survivor:drop_predicate (dropping this predicate cannot change the answer on this data (the bound lies beyond the data, which ends on 14 June 2026, or the predicate is redundant)); accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

- id: join2-016
  question: "How many units were sold through each sales channel?"
  tags: [join_2]
  difficulty: easy
  expect:
    kind: answer
    reference_sql: |
