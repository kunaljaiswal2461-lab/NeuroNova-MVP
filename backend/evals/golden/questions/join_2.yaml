    reference_sql: |
      SELECT c.id, c.full_name FROM shop.customers c LEFT JOIN shop.orders o ON o.customer_id = c.id WHERE o.id IS NULL
    output_type: table
  reviewed_by: null

- id: join2-011
  question: "How many inactive products have been sold at least once?"
  tags: [join_2]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT count(DISTINCT i.product_id) FROM shop.order_items i JOIN shop.products p ON p.id = i.product_id WHERE NOT p.is_active
    output_type: kpi
  reviewed_by: null

