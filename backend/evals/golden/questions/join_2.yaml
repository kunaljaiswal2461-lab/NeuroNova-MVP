    output_type: bar
  reviewed_by: null

- id: join2-017
  question: "For each product category, compare the average list price with the average price actually charged on order lines."
  tags: [join_2]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT p.category, avg(p.unit_price) AS avg_list_price, avg(i.unit_price) AS avg_charged_price FROM shop.order_items i JOIN shop.products p ON p.id = i.product_id GROUP BY p.category
    output_type: scatter
    numeric_tolerance:
      abs: "0.01"
  notes: "Both averages are over order lines (the list price is taken per line, not per product)."
  reviewed_by: null

- id: join2-018
  question: "On average, how many days after the order is a refund issued?"
  tags: [join_2, tz_boundary]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT avg(extract(epoch FROM (r.refunded_at - (o.ordered_at AT TIME ZONE 'Asia/Kolkata'))) / 86400.0)
      FROM shop.refunds r JOIN shop.orders o ON o.id = r.order_id
    output_type: kpi
    numeric_tolerance:
      abs: "0.01"
  notes: "Decimal days. refunded_at is IST wall-clock without a zone; ordered_at must be converted to IST before subtracting. Treating refunded_at as UTC shifts the answer by 0.23 days."
  reviewed_by: null

