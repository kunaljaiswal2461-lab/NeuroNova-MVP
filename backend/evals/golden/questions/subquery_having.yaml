    reference_sql: |
      SELECT city, count(*) FROM shop.customers GROUP BY city HAVING count(*) > 85
    output_type: table
  reviewed_by: null

- id: sub-004
  question: "How many customers have spent more than the average customer on paid orders?"
  tags: [subquery_having]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      WITH s AS (SELECT customer_id, sum(total_amount) AS spend FROM shop.orders WHERE status = 'PAID' AND customer_id IS NOT NULL GROUP BY customer_id)
      SELECT count(*) FROM s WHERE spend > (SELECT avg(spend) FROM s)
    output_type: narrative
  notes: "Average over customers who have at least one paid order. accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

- id: sub-005
  question: "Which orders from 14 June 2026 are worth more than the average paid order?"
  tags: [subquery_having, tz_boundary]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT id, status, total_amount FROM shop.orders
      WHERE ordered_at >= TIMESTAMPTZ '2026-06-14 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-06-15 00:00:00+05:30'
        AND total_amount > (SELECT avg(total_amount) FROM shop.orders WHERE status = 'PAID')
    output_type: table
  notes: "Orders of any status on that IST day, compared with the all-time average paid order value. accept-survivor:drop_predicate (dropping this predicate cannot change the answer on this data (the bound lies beyond the data, which ends on 14 June 2026, or the predicate is redundant)); accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

- id: sub-006
  question: "Which customers have placed orders but never a paid one?"
  tags: [subquery_having]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT c.id, c.full_name FROM shop.customers c
      WHERE EXISTS (SELECT 1 FROM shop.orders o WHERE o.customer_id = c.id)
        AND NOT EXISTS (SELECT 1 FROM shop.orders o WHERE o.customer_id = c.id AND o.status = 'PAID')
    output_type: table
  reviewed_by: null

