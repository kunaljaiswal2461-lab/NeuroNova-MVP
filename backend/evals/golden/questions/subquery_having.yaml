- id: sub-009
  question: "Which month of 2025 had the highest paid order value?"
  tags: [subquery_having]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT date_trunc('month', ordered_at AT TIME ZONE 'Asia/Kolkata')::date AS month, sum(total_amount) AS v FROM shop.orders WHERE status = 'PAID' AND ordered_at >= TIMESTAMPTZ '2025-01-01 00:00:00+05:30' AND ordered_at < TIMESTAMPTZ '2026-01-01 00:00:00+05:30' GROUP BY 1 ORDER BY v DESC LIMIT 1
    output_type: narrative
    order_matters: true
  notes: "Month labels are the first day of the month (a date). accept-survivor:drop_predicate (dropping this predicate cannot change the answer on this data (the bound lies beyond the data, which ends on 14 June 2026, or the predicate is redundant)); accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

- id: sub-010
  question: "Which regions have an average paid order value above the overall average?"
  tags: [subquery_having, join_3plus]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT r.name FROM shop.orders o JOIN shop.customers c ON c.id = o.customer_id JOIN shop.regions r ON r.id = c.region_id WHERE o.status = 'PAID' GROUP BY r.id, r.name
      HAVING avg(o.total_amount) > (SELECT avg(total_amount) FROM shop.orders WHERE status = 'PAID')
    output_type: table
  notes: "Overall average over all paid orders including guests; regional averages only cover orders with a customer. accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie); accept-survivor:join_flip (a later INNER JOIN or a WHERE on the joined table removes the rows a LEFT JOIN would add)"
  reviewed_by: null
