- id: sub-001
  question: "Which customers have placed more than 30 orders?"
  tags: [subquery_having]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT c.id, c.full_name, count(*) AS orders FROM shop.orders o JOIN shop.customers c ON c.id = o.customer_id GROUP BY c.id, c.full_name HAVING count(*) > 30
    output_type: table
  notes: "All statuses. accept-survivor:agg_swap (the column has no NULLs in the rows being counted)"
  reviewed_by: null

- id: sub-002
  question: "Which products have sold more than 1,000 units in total?"
  tags: [subquery_having]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT p.sku, p.name, sum(i.quantity) AS units FROM shop.order_items i JOIN shop.products p ON p.id = i.product_id GROUP BY p.id, p.sku, p.name HAVING sum(i.quantity) > 1000
    output_type: table
  notes: "accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

- id: sub-003
  question: "Which cities have more than 85 customers?"
  tags: [subquery_having]
  difficulty: easy
  expect:
