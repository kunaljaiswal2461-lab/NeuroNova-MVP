- id: stf-015
  question: "What are the 10 most expensive active products?"
  tags: [single_table_filter]
  difficulty: easy
  expect:
    kind: answer
    reference_sql: |
      SELECT sku, name, unit_price
      FROM shop.products
      WHERE is_active
      ORDER BY unit_price DESC
      LIMIT 10
    output_type: ranked_list
    order_matters: true
  notes: "'Active' means is_active. Prices are distinct at the cut-off."
  reviewed_by: null
