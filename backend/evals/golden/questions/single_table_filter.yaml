- id: stf-013
  question: "Show the 'Damaged on arrival' refunds issued in March 2026."
  tags: [single_table_filter, tz_boundary]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT id, order_id, amount, refunded_at
      FROM shop.refunds
      WHERE reason = 'Damaged on arrival'
        AND refunded_at >= TIMESTAMP '2026-03-01 00:00:00'
        AND refunded_at <  TIMESTAMP '2026-04-01 00:00:00'
    output_type: table
  notes: "refunds.refunded_at is timestamp WITHOUT time zone and already holds IST wall-clock time. Compare it with naive literals. Converting it as if it were UTC shifts every row by 5h30m."
  reviewed_by: null

