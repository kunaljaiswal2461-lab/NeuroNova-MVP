- id: stf-006
  question: "Show the orders placed on 14 June 2026."
  tags: [single_table_filter, tz_boundary]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT id, customer_id, status, total_amount
      FROM shop.orders
      WHERE ordered_at >= TIMESTAMPTZ '2026-06-14 00:00:00+05:30'
        AND ordered_at <  TIMESTAMPTZ '2026-06-15 00:00:00+05:30'
    output_type: table
  notes: "A calendar day is an IST day. A UTC day would miss the first 5.5 hours of the IST day and add orders from 15 June IST. accept-survivor:drop_predicate (dropping this predicate cannot change the answer on this data (the bound lies beyond the data, which ends on 14 June 2026, or the predicate is redundant)); accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

