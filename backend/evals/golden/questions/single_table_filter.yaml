- id: stf-001
  question: "Show me the customers in Mumbai who signed up in 2026."
  tags: [single_table_filter]
  difficulty: easy
  expect:
    kind: answer
    reference_sql: |
      SELECT id, full_name, email, signup_at
      FROM shop.customers
      WHERE city = 'Mumbai'
        AND signup_at >= TIMESTAMPTZ '2026-01-01 00:00:00+05:30'
    output_type: table
  notes: "Year boundary is IST. 2026 means 1 Jan 2026 onwards (data runs to 9 June)."
  reviewed_by: null

- id: stf-002
  question: "Which active Electronics products cost more than 40,000 rupees?"
  tags: [single_table_filter]
  difficulty: easy
  expect:
    kind: answer
    reference_sql: |
      SELECT id, sku, name, unit_price
      FROM shop.products
      WHERE category = 'Electronics' AND is_active AND unit_price > 40000
    output_type: table
  notes: "'Active' means is_active = true. Strictly more than 40000."
  reviewed_by: null

