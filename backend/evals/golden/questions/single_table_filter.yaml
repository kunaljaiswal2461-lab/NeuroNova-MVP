- id: stf-010
  question: "Show the checkout page views between 11 pm and midnight on 14 June 2026."
  tags: [single_table_filter, tz_boundary]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT id, customer_id, viewed_at
      FROM shop.page_views
      WHERE path = '/checkout'
        AND viewed_at >= TIMESTAMPTZ '2026-06-14 23:00:00+05:30'
        AND viewed_at <  TIMESTAMPTZ '2026-06-15 00:00:00+05:30'
    output_type: table
  notes: "Times are IST. The path value is '/checkout' with a leading slash. This table has 2,000,000 rows. accept-survivor:drop_predicate (dropping this predicate cannot change the answer on this data (the bound lies beyond the data, which ends on 14 June 2026, or the predicate is redundant)); accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

