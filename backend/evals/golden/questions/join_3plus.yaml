- id: join3-004
  question: "How many units of each product category do our Enterprise customers buy?"
  tags: [join_3plus, dirty_literal]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT p.category, sum(i.quantity)
      FROM shop.order_items i JOIN shop.orders o ON o.id = i.order_id JOIN shop.customers c ON c.id = o.customer_id JOIN shop.products p ON p.id = i.product_id
      WHERE lower(trim(c.segment)) = 'enterprise' GROUP BY p.category
    output_type: bar
  notes: "Enterprise includes the padded, lowercase 'enterprise ' variants (12 customers). accept-survivor:join_flip (a later INNER JOIN or a WHERE on the joined table removes the rows a LEFT JOIN would add)"
  reviewed_by: null

- id: join3-005
  question: "How many different customers have bought something from the Beauty category?"
  tags: [join_3plus]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT count(DISTINCT o.customer_id) FROM shop.order_items i JOIN shop.orders o ON o.id = i.order_id JOIN shop.products p ON p.id = i.product_id
      WHERE p.category = 'Beauty'
    output_type: kpi
  notes: "Guest orders (NULL customer) are not customers."
  reviewed_by: null

- id: join3-006
  question: "What is the average value of paid orders that contain at least one inactive product?"
  tags: [join_3plus, join_fanout]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT avg(o.total_amount) FROM shop.orders o
      WHERE o.status = 'PAID' AND EXISTS (SELECT 1 FROM shop.order_items i JOIN shop.products p ON p.id = i.product_id WHERE i.order_id = o.id AND NOT p.is_active)
    output_type: kpi
    numeric_tolerance:
      abs: "0.01"
  notes: "Each order counts once however many inactive lines it has."
  reviewed_by: null

