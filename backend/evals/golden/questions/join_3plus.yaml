- id: join3-001
  question: "What is the total value of items sold in each zone, counting paid orders only?"
  tags: [join_3plus]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT r.zone, sum(i.quantity * i.unit_price) FROM shop.order_items i JOIN shop.orders o ON o.id = i.order_id JOIN shop.customers c ON c.id = o.customer_id JOIN shop.regions r ON r.id = c.region_id WHERE o.status = 'PAID' GROUP BY r.zone
    output_type: bar
  notes: "Line value = quantity x unit_price (not orders.total_amount, which includes GST). accept-survivor:join_flip (a later INNER JOIN or a WHERE on the joined table removes the rows a LEFT JOIN would add)"
  reviewed_by: null

- id: join3-002
  question: "Which 5 regions have the highest total value of paid orders?"
  tags: [join_3plus]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT r.name, sum(o.total_amount) AS total FROM shop.orders o JOIN shop.customers c ON c.id = o.customer_id JOIN shop.regions r ON r.id = c.region_id WHERE o.status = 'PAID' GROUP BY r.id, r.name ORDER BY total DESC LIMIT 5
    output_type: ranked_list
    order_matters: true
  notes: "accept-survivor:join_flip (a later INNER JOIN or a WHERE on the joined table removes the rows a LEFT JOIN would add)"
  reviewed_by: null

