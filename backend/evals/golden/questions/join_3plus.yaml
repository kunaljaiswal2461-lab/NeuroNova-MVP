- id: join3-010
  question: "How many Electronics units were sold in each month of 2025?"
  tags: [join_3plus, time_bucket]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT date_trunc('month', o.ordered_at AT TIME ZONE 'Asia/Kolkata')::date AS month, sum(i.quantity)
      FROM shop.order_items i JOIN shop.orders o ON o.id = i.order_id JOIN shop.products p ON p.id = i.product_id
      WHERE p.category = 'Electronics' AND o.ordered_at >= TIMESTAMPTZ '2025-01-01 00:00:00+05:30' AND o.ordered_at < TIMESTAMPTZ '2026-01-01 00:00:00+05:30'
      GROUP BY 1 ORDER BY 1
    output_type: line
    order_matters: true
  notes: "Month labels are the first day of the month (a date). accept-survivor:flip_comparison (no row sits exactly on this boundary, or the comparison is between aggregates that cannot tie)"
  reviewed_by: null

- id: join3-011
  question: "Among customers in the West zone, which channel has the highest average order value? Rank all channels."
  tags: [join_3plus]
  difficulty: medium
  expect:
    kind: answer
    reference_sql: |
      SELECT o.channel, avg(o.total_amount) AS avg_value FROM shop.orders o JOIN shop.customers c ON c.id = o.customer_id JOIN shop.regions r ON r.id = c.region_id WHERE r.zone = 'West' GROUP BY o.channel ORDER BY avg_value DESC
    output_type: takeaways
    order_matters: true
    numeric_tolerance:
      abs: "0.01"
  notes: "All order statuses. accept-survivor:join_flip (a later INNER JOIN or a WHERE on the joined table removes the rows a LEFT JOIN would add)"
  reviewed_by: null

- id: join3-012
  question: "How many shipped orders does each zone have?"
  tags: [join_3plus, awkward_identifiers]
  difficulty: hard
  expect:
    kind: answer
    reference_sql: |
      SELECT r.zone, count(DISTINCT o.id)
      FROM shop."Order Events" e JOIN shop.orders o ON o.id = e."order" JOIN shop.customers c ON c.id = o.customer_id JOIN shop.regions r ON r.id = c.region_id
      WHERE e."Event Type" = 'shipped' GROUP BY r.zone
    output_type: bar
  notes: "accept-survivor:join_flip (a later INNER JOIN or a WHERE on the joined table removes the rows a LEFT JOIN would add)"
  reviewed_by: null
