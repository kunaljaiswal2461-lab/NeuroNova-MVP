# SPEC-04 §11.2. Table-driven: every case must be rejected with exactly `code`.
# `scope: dup` uses the scope with the same table name in two schemas (ambiguous_table).
# Expected codes follow the §7 stage order: a node-type rejection (stage 5) comes before the
# token-level function check (stage 6), so e.g. current_user is `unsupported_syntax`.

