# ── found while probing (not in the spec's list; see spec04.learning.md) ───────────────
# A CTE or derived-table alias that shares a name with a system table must not hide it.
- {id: hazard-cte-shadows-qualified, sql: "WITH pg_authid AS (SELECT 1 a) SELECT * FROM pg_catalog.pg_authid", code: table_not_in_scope}
- {id: hazard-derived-alias-shadows, sql: "SELECT * FROM (SELECT 1 a) AS pg_class, pg_class", code: table_not_in_scope}
- {id: hazard-cte-defined-later, sql: "WITH a AS (SELECT * FROM b), b AS (SELECT 1 x) SELECT * FROM a", code: table_not_in_scope}
- {id: hazard-cte-in-sibling-body, sql: "WITH a AS (SELECT 1 x) SELECT * FROM (SELECT * FROM a) t, pg_roles", code: table_not_in_scope}
# Postgres reads an unquoted `user` as current_user even when a column has that name.
- {id: hazard-user-keyword-column, sql: "SELECT user FROM shop.sessions", code: unsupported_syntax, scope: user_col}
- {id: hazard-current-role-column, sql: "SELECT current_role FROM shop.sessions", code: unsupported_syntax, scope: user_col}
- {id: hazard-system-user-column, sql: "SELECT system_user FROM shop.sessions", code: unsupported_syntax, scope: user_col}
- {id: hazard-user-in-where, sql: "SELECT id FROM shop.sessions WHERE user = 'x'", code: unsupported_syntax, scope: user_col}
